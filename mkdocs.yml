site_name: blackbelt
site_url: https://evihex.github.io/jj-blackbelt/
site_description: Make stacked pull requests built with Jujutsu obvious on GitHub.
repo_url: https://github.com/EviHex/jj-blackbelt
repo_name: EviHex/jj-blackbelt
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/blackbelt.png
  favicon: assets/blackbelt.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Command reference: commands.md
  - Configuration: configuration.md
  - Shell & jj integration: integration.md
  - Architecture: architecture.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: Built for people who already like their jj workflow.
